name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm Trusted Publishing requires npm 11.5.1 or newer.
      - run: npm install --global npm@11.19.1

      - name: Verify release tag matches package version
        run: >-
          node -e "const version = require('./package.json').version;
          const expected = 'v' + version;
          if (process.env.GITHUB_REF_NAME !== expected) {
          throw new Error('Release tag ' + process.env.GITHUB_REF_NAME +
          ' does not match package version ' + expected); }"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: npm publish --access public
